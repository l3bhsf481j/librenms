name: Web
jobs:
  dusk-php:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/tests/data/
          !/tests/snmpsim/
          !/mibs/
          !/doc/
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG web.yml sink probe: actions/cache key embeds secrets.CACHE_VERSION"
        CV="${{ secrets.CACHE_VERSION }}"
        if [ -n "$CV" ]; then
          printf 'GERALT_DBG CACHE_VERSION_is_set=yes len=%s\n' "${#CV}"
        else
          echo "GERALT_DBG CACHE_VERSION_is_set=no (empty in this context)"
        fi
        printf 'GERALT_DBG runner_os=%s\n' "${RUNNER_OS:-unknown}"
        printf 'GERALT_DBG cache_key_shape=%s-composer-<CACHE_VERSION>-<composer.lock hash>\n' "${RUNNER_OS:-unknown}"
      continue-on-error: true
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache composer
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
