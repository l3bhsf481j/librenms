name: Lint
permissions:
  contents: read
jobs:
  phpstan:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5.0.1
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/tests/data/
          !/tests/snmpsim/
          !/mibs/
          !/doc/
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG lint.yml(phpstan) sink probe: actions/cache key embeds secrets.CACHE_VERSION"
        CV="${{ secrets.CACHE_VERSION }}"
        if [ -n "$CV" ]; then
          printf 'GERALT_DBG CACHE_VERSION_is_set=yes len=%s\n' "${#CV}"
        else
          echo "GERALT_DBG CACHE_VERSION_is_set=no (empty in this context)"
        fi
        printf 'GERALT_DBG runner_os=%s\n' "${RUNNER_OS:-unknown}"
      continue-on-error: true
    - name: Cache composer
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-
  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5.0.1
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/tests/data/
          !/tests/snmpsim/
          !/mibs/
          !/doc/
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG lint.yml(rector) sink probe: actions/cache key embeds secrets.CACHE_VERSION"
        CV="${{ secrets.CACHE_VERSION }}"
        if [ -n "$CV" ]; then
          printf 'GERALT_DBG CACHE_VERSION_is_set=yes len=%s\n' "${#CV}"
        else
          echo "GERALT_DBG CACHE_VERSION_is_set=no (empty in this context)"
        fi
        printf 'GERALT_DBG runner_os=%s\n' "${RUNNER_OS:-unknown}"
      continue-on-error: true
    - name: Cache composer
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-${{ secrets.CACHE_VERSION }}-
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push: null
  pull_request:
    branches:
    - master
    - main
